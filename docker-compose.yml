  #     - DB_USERNAME=${DB_USERNAME}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - JWT_SECRET=${JWT_SECRET}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - project_network

volumes:
  project_pgdata:
    name: project_pgdata_vol

networks:
  project_network:
    driver: bridge